{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F1626">
  <meta name="apple-mobile-web-app-title" content="PWDigital">
  <meta property="og:type" content="website">
  <meta property="og:title" content="PWDigital">
  <meta property="og:description" content="Account portal for digital PWD services">
  {% if request %}
    <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'img/pwdigital-og.png' %}">
  {% else %}
    <meta property="og:image" content="{% static 'img/pwdigital-og.png' %}">
  {% endif %}
  <meta property="og:image:alt" content="PWDigital logo on a white background">
  <meta name="twitter:image:alt" content="PWDigital logo on a white background">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  {% if request %}
    <meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'img/pwdigital-og.png' %}">
  {% else %}
    <meta name="twitter:image" content="{% static 'img/pwdigital-og.png' %}">
  {% endif %}
  <title>{% block title %}PWDigital{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="{% static 'img/pwdigital-icon.svg' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="512x512" href="{% static 'img/pwdigital-icon-512.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% block content %}{% endblock %}
</body>
</html>
