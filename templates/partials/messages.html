{% if messages %}
  <div class="messages" aria-label="Notifications">
    {% for message in messages %}
      <div class="message-alert message-{{ message.level_tag }}" role="alert">
        <svg class="message-icon" viewBox="0 0 24 24" aria-hidden="true">
          {% if 'success' in message.tags %}
            <path d="m5 12 4 4L19 6"/>
          {% elif 'error' in message.tags %}
            <path d="m7 7 10 10M17 7 7 17"/>
          {% elif 'warning' in message.tags %}
            <path d="M12 8v5m0 3h.01M10.3 4.6 2.9 17.4A1.8 1.8 0 0 0 4.5 20h15a1.8 1.8 0 0 0 1.6-2.6L13.6 4.6a1.8 1.8 0 0 0-3.3 0Z"/>
          {% else %}
            <circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>
          {% endif %}
        </svg>
        <p>{{ message }}</p>
        <button class="message-dismiss" type="button" data-dismiss-alert aria-label="Dismiss notification">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
