<div class="form-field{% if field_class %} {{ field_class }}{% endif %}{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">
    {{ field.label }}
    {% if field.field.required or required_override %}<span class="required-mark" aria-hidden="true">*</span>{% endif %}
  </label>
  <div class="field-control{% if field.field.widget.input_type == 'file' %} file-control{% endif %}">
    {{ field }}
    {% if field.field.widget.input_type == 'file' %}
      <span class="file-input-name" data-file-name aria-live="polite">No file selected</span>
    {% endif %}
  </div>
  {% if field.help_text %}<div class="field-help" id="help-{{ field.id_for_label }}">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}
    <div class="field-errors" id="{{ field.id_for_label }}_error" aria-live="polite">
      {% for error in field.errors %}<p>{{ error }}</p>{% endfor %}
    </div>
  {% endif %}
</div>
